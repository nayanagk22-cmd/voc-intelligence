name: voc-intelligence

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voc}
      POSTGRES_USER: ${POSTGRES_USER:-voc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # no published port: only the backend can reach the database

  backend:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DATA_DIR: /data
      DATA_FILE: /data/${DATA_FILE_NAME:-enriched_unified_data.xlsx}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"   # optional: exposes /docs for reviewers
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  pgdata:
